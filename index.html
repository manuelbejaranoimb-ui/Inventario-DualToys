function useLocalState(key, initial){
  const [state,setState] = useState(()=>{
    try{ const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : initial; }
    catch(e){ return initial; }
  });
  useEffect(()=>{ try{ localStorage.setItem(key, JSON.stringify(state)); }catch(e){} }, [key,state]);
  return [state,setState];
}

function KPI({label, value, sub, icon, tone}){
  const toneMap = {gold:"var(--gold)", violet:"var(--violet)", green:"var(--green)", red:"var(--red)"};
  return (
    <div className="bg-[var(--surface)] border border-[var(--border)] rounded-xl p-4 flex flex-col gap-2">
      <div className="flex items-center justify-between">

function resizeImage(file, maxDim=360, calidad=0.75){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("No se pudo leer la imagen."));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("Archivo de imagen inválido."));
      img.onload = () => {
        let {width,height} = img;
        if(width>height && width>maxDim){ height = height*maxDim/width; width = maxDim; }
        else if(height>maxDim){ width = width*maxDim/height; height = maxDim; }
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(width); canvas.height = Math.round(height);
        canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL("image/jpeg", calidad));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function ProductForm({onSave,onClose,editing}){
  const [form,setForm] = useState(editing ? {...EMPTY_FORM,...editing} : {...EMPTY_FORM});
  const [subiendoFoto,setSubiendoFoto] = useState(false);
  const [fotoError,setFotoError] = useState("");

  const set = (k,v)=>setForm(f=>({...f,[k]:v}));
  const camposExtra = camposExtraPara(form.juego);
  const onFotoChange = async e => {
    const file = e.target.files[0]; if(!file) return;
    setSubiendoFoto(true); setFotoError("");
    try{ set("foto", await resizeImage(file)); }
    catch(err){ setFotoError(err.message); }
    finally{ setSubiendoFoto(false); e.target.value=""; }

    e.preventDefault();
    setFormError("");
    if(!form.nombre.trim()) return;
    if(form.monedaCompra==="USD" && !Number(form.tasaCambio)){
      setFormError("Ingresa la tasa de cambio (COP por USD) para calcular el costo real en pesos.");
      return;
    }
    onSave({
      ...form,
      id: editing ? editing.id : Date.now(),
      cantidad: Number(form.cantidad)||1,
      pCompra: Number(form.pCompra)||0,
      tasaCambio: form.monedaCompra==="USD" ? Number(form.tasaCambio)||0 : 0,
      pMercado: Number(form.pMercado)||0,
      pVenta: Number(form.pVenta)||0,
      fecha: editing ? editing.fecha : Date.now(),
    });
  };

    <div className="fixed inset-0 bg-black/60 flex items-start md:items-center justify-center z-50 p-4 overflow-y-auto" onClick={onClose}>

          <button type="button" onClick={onClose} className="text-[var(--muted)] hover:text-white"><IX className="w-5 h-5"/></button>
        </div>
        <Field label="Foto (opcional)">
          <div className="flex items-center gap-3">

              </label>
              {form.foto && <button type="button" onClick={()=>set("foto","")} className="text-xs text-[var(--muted)] hover:text-[var(--red)] text-left">Quitar foto</button>}
              {fotoError && <span className="text-xs text-[var(--red)]">{fotoError}</span>}
            </div>
          </div>
        </Field>
        <Field label="Nombre del producto">
          <input required value={form.nombre} onChange={e=>set("nombre",e.target.value)} placeholder="Ej: Charizard VMAX Champion's Path" className="rounded-lg px-3 py-2"/>
        </Field>
        <div className="grid grid-cols-2 gap-3">
          <Field label="Juego / Categoría">
            <select value={form.juego} onChange={e=>set("juego",e.target.value)} className="rounded-lg px-3 py-2">
              {JUEGOS.map(j=><option key={j}>{j}</option>)}
            </select>
          </Field>
          <Field label="Estado / Condición">
            <select value={form.condicion} onChange={e=>set("condicion",e.target.value)} className="rounded-lg px-3 py-2">

        </div>
      </form>
    </div>
  );
}

async function downloadFile(filename, blob){
  try{
    const downloads = await window.claude?.use?.("downloads");
    if(downloads){
      await downloads.save({filename, data: blob});
      return;
    }
  }catch(err){
    if(err?.code==="declined") return;
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href=url; a.download=filename; a.click();
  URL.revokeObjectURL(url);
}

function Sparkline({data}){
  if(data.length<2) return <div className="text-sm text-[var(--muted)] py-8 text-center">Registra al menos dos precios para ver la gráfica.</div>;
  const w=320,h=110,pad=20;
  const prices = data.map(d=>d.precio);
  const min=Math.min(...prices), max=Math.max(...prices), range=(max-min)||1;
  const stepX=(w-pad*2)/(data.length-1);
  const pts = data.map((d,i)=>[pad+i*stepX, h-pad-((d.precio-min)/range)*(h-pad*2)]);
  const path = pts.map((p,i)=>(i===0?"M":"L")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  const color = data[data.length-1].precio >= data[0].precio ? "var(--green)" : "var(--red)";
  return (
    <svg viewBox={`0 0 ${w} ${h}`} className="w-full h-28">
      <path d={path} fill="none" stroke={color} strokeWidth="2"/>
      {pts.map((p,i)=><circle key={i} cx={p[0]} cy={p[1]} r="3" fill={color}/>)}
    </svg>
  );
}

function PriceHistoryModal({item,onClose,onAdd}){
  const [precio,setPrecio] = useState("");
  const [fecha,setFecha] = useState(new Date().toISOString().slice(0,10));
  const hist = (item.historial||[]).slice().sort((a,b)=>a.fecha-b.fecha);
  const submit = e => { e.preventDefault(); if(!precio) return; onAdd(item.id,precio,fecha); setPrecio(""); };
  return (
    <div className="fixed inset-0 bg-black/60 flex items-start md:items-center justify-center z-50 p-4 overflow-y-auto" onClick={onClose}>
      <div onClick={e=>e.stopPropagation()} className="bg-[var(--surface)] border border-[var(--border)] rounded-2xl w-full max-w-md p-6 my-8 flex flex-col gap-4">
        <div className="flex items-center justify-between">
          <div>
            <h2 className="font-display text-lg font-semibold">Historial de precio</h2>
            <p className="text-sm text-[var(--muted)]">{item.nombre}</p>
          </div>
          <button onClick={onClose} className="text-[var(--muted)] hover:text-white"><IX className="w-5 h-5"/></button>
        </div>
        <Sparkline data={hist}/>
        <div className="max-h-40 overflow-y-auto flex flex-col gap-1 text-sm">
          {hist.slice().reverse().map((h,i)=>{
            const idxAsc = hist.length-1-i, prev = hist[idxAsc-1];
            const delta = prev ? (h.precio-prev.precio)/prev.precio*100 : null;
            return (
              <div key={h.fecha+"-"+i} className="flex items-center justify-between border-b border-[var(--border)] last:border-0 py-1.5">
                <span className="text-[var(--muted)]">{new Date(h.fecha).toLocaleDateString("es-CO",{day:"2-digit",month:"short",year:"numeric"})}</span>
                <span className="font-medium">{fmt(h.precio)}</span>
                {delta!=null && <span style={{color:delta>=0?"var(--green)":"var(--red)"}} className="text-xs w-16 text-right">{delta>=0?"+":""}{delta.toFixed(1)}%</span>}
              </div>
            );
          })}
        </div>
        <form onSubmit={submit} className="flex items-end gap-2 pt-3 border-t border-[var(--border)]">
          <Field label="Fecha">
            <input type="date" value={fecha} onChange={e=>setFecha(e.target.value)} className="rounded-lg px-3 py-2"/>
          </Field>
          <Field label="Precio observado">
            <input type="number" step="0.01" min="0" value={precio} onChange={e=>setPrecio(e.target.value)} placeholder="0.00" className="rounded-lg px-3 py-2 w-28"/>
          </Field>
          <button type="submit" className="px-3 py-2 rounded-lg font-medium whitespace-nowrap" style={{background:"var(--gold)",color:"#181405"}}>Registrar</button>
        </form>
      </div>
    </div>
  );
}

function ConfirmDialog({mensaje,onConfirm,onCancel}){
  return (
    <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-[60] p-4" onClick={onCancel}>
      <div onClick={e=>e.stopPropagation()} className="bg-[var(--surface)] border border-[var(--border)] rounded-2xl w-full max-w-sm p-6 flex flex-col gap-4">
        <p className="text-sm">{mensaje}</p>
        <div className="flex justify-end gap-2">
          <button onClick={onCancel} className="px-4 py-2 rounded-lg border border-[var(--border)] text-[var(--muted)] hover:text-white">Cancelar</button>
          <button onClick={onConfirm} className="px-4 py-2 rounded-lg font-medium" style={{background:"var(--red)",color:"#1a0b0a"}}>Eliminar</button>
        </div>
      </div>
    </div>
  );
}

function App(){
  const [items,setItems] = useLocalState("vb_inventory", SEED);
  const [query,setQuery] = useState("");
  const [filtroJuego,setFiltroJuego] = useState("Todos");
  const [orden,setOrden] = useState("recientes");
  const [vista,setVista] = useState("todos");
  const [showForm,setShowForm] = useState(false);
  const [editing,setEditing] = useState(null);
  const [historyId,setHistoryId] = useState(null);
  const [deleteId,setDeleteId] = useState(null);
  const [importError,setImportError] = useState("");
  const fileInput = useRef(null);

  const withCalc = it => {
    const pCompraCOP = it.monedaCompra==="USD" ? it.pCompra*(Number(it.tasaCambio)||0) : it.pCompra;
    const totalCompra = pCompraCOP*it.cantidad;
    const totalMercado = it.pMercado*it.cantidad;
    const totalVenta = (it.pVenta||0)*it.cantidad;
    const gananciaUnidad = (it.pVenta||0)-pCompraCOP;
    const gananciaTotal = totalVenta-totalCompra;
    const gananciaMercadoUnidad = it.pMercado-pCompraCOP;
    const gananciaMercadoTotal = totalMercado-totalCompra;
    const gananciaMercadoPct = pCompraCOP>0 ? (gananciaMercadoUnidad/pCompraCOP*100) : null;
    const hist = (it.historial||[]).slice().sort((a,b)=>a.fecha-b.fecha);
    const trendPct = hist.length>=2 ? (hist[hist.length-1].precio-hist[hist.length-2].precio)/hist[hist.length-2].precio*100 : null;
    return {...it, pCompraCOP, totalCompra, totalMercado, totalVenta, gananciaUnidad, gananciaTotal, gananciaMercadoUnidad, gananciaMercadoTotal, gananciaMercadoPct, trendPct};
  };

  const itemsVista = useMemo(()=> items.filter(it =>
    vista==="todos" || (vista==="venta" && it.tipo!=="Colección personal") || (vista==="coleccion" && it.tipo==="Colección personal")
  ),[items,vista]);

  const filtered = useMemo(()=>{
    let list = itemsVista.map(withCalc).filter(it=>{
      const matchQ = it.nombre.toLowerCase().includes(query.toLowerCase()) || it.notas.toLowerCase().includes(query.toLowerCase());
      const matchJ = filtroJuego==="Todos" || it.juego===filtroJuego;
      return matchQ && matchJ;
    });
    if(orden==="ganancia") list.sort((a,b)=>b.gananciaTotal-a.gananciaTotal);
    else if(orden==="gananciaMercado") list.sort((a,b)=>b.gananciaMercadoTotal-a.gananciaMercadoTotal);
    else if(orden==="valor") list.sort((a,b)=>b.totalMercado-a.totalMercado);
    else list.sort((a,b)=>b.fecha-a.fecha);
    return list;
  },[itemsVista,query,filtroJuego,orden]);

  const stats = useMemo(()=>{
    const all = itemsVista.map(withCalc);
    const inversion = all.reduce((s,i)=>s+i.totalCompra,0);
    const valorMercado = all.reduce((s,i)=>s+i.totalMercado,0);
    const ingresosVenta = all.reduce((s,i)=>s+i.totalVenta,0);
    const ganancia = ingresosVenta-inversion;
    const pct = inversion>0 ? (ganancia/inversion*100) : 0;
    const gananciaMercado = valorMercado-inversion;
    const pctMercado = inversion>0 ? (gananciaMercado/inversion*100) : 0;
    const stock = all.reduce((s,i)=>s+i.cantidad,0);
    return {inversion,valorMercado,ingresosVenta,ganancia,pct,gananciaMercado,pctMercado,stock};
  },[itemsVista]);


  const saveItem = it => {
    setItems(prev => {
      if(editing){
        return prev.map(p=>{
          if(p.id!==it.id) return p;
          let historial = p.historial || [];
          if(Number(it.pMercado)!==Number(p.pMercado)){
            historial = [...historial, {precio:Number(it.pMercado), fecha:Date.now()}];
          }
          return {...it, historial};
        });
      }
      return [...prev, {...it, historial:[{precio:Number(it.pMercado), fecha:Date.now()}]}];
    });
    setShowForm(false); setEditing(null);
  };
  const removeItem = id => setItems(prev=>prev.filter(p=>p.id!==id));
  const addSnapshot = (id, precio, fechaStr) => {
    const fecha = fechaStr ? new Date(fechaStr).getTime() : Date.now();
    setItems(prev => prev.map(it=>{
      if(it.id!==id) return it;
      const historial = [...(it.historial||[]), {precio:Number(precio), fecha}].sort((a,b)=>a.fecha-b.fecha);
      const esMasReciente = historial[historial.length-1].fecha===fecha;
      return {...it, historial, pMercado: esMasReciente ? Number(precio) : it.pMercado};
    }));
  };

  const exportJSON = () => {
    const blob = new Blob([JSON.stringify(items,null,2)],{type:"application/json"});
    downloadFile("inventario-tcg.json", blob);
  };
  const exportCSV = () => {
    const headers = ["nombre","juego","condicion","cantidad","pCompra","monedaCompra","tasaCambio","pCompraCOP","pMercado","pVenta","notas"];
    const rows = items.map(withCalc).map(it=>headers.map(h=>`"${String(it[h]??"").replace(/"/g,'""')}"`).join(","));
    const csv = [headers.join(","),...rows].join("\n");
    const blob = new Blob([csv],{type:"text/csv"});
    downloadFile("inventario-tcg.csv", blob);
  };
  const importJSON = e => {
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try{
        const data = JSON.parse(ev.target.result);
        if(!Array.isArray(data)) throw new Error("Formato inválido");
        const clean = data.map(d=>({
          id: d.id||Date.now()+Math.random(), nombre:d.nombre||"Sin nombre", juego:d.juego||"Otro",
          condicion:d.condicion||"Near Mint", cantidad:Number(d.cantidad)||1, pCompra:Number(d.pCompra)||0,
          monedaCompra: d.monedaCompra==="USD" ? "USD" : "COP", tasaCambio:Number(d.tasaCambio)||0,
          pMercado:Number(d.pMercado)||0, pVenta:Number(d.pVenta)||0, notas:d.notas||"", fecha:d.fecha||Date.now(),
          tipo: d.tipo==="Colección personal" ? "Colección personal" : "Para vender",
          edicion:d.edicion||"", grading:d.grading||"", escala:d.escala||"", linea:d.linea||"",
          foto:d.foto||"", historial: Array.isArray(d.historial) ? d.historial : [],
        }));
        setItems(clean);
        setImportError("");
      }catch(err){ setImportError("No se pudo importar el archivo: "+err.message); }
      finally{ e.target.value=""; }
    };
    reader.readAsText(file);
  };

  return (
    <div className="min-h-screen max-w-7xl mx-auto px-4 md:px-8 py-8">
      <header className="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
        <div className="flex items-center gap-3">
          <div className="w-11 h-11 rounded-xl flex items-center justify-center" style={{background:"linear-gradient(135deg,var(--gold),var(--violet))"}}>
            <ILayers className="w-6 h-6 text-[#14161c]"/>
          </div>
          <div>
            <h1 className="font-display text-2xl font-bold leading-none">VaultBinder</h1>
            <p className="text-sm text-[var(--muted)]">Inventario de coleccionables y TCG</p>
          </div>
        </div>
        <div className="flex flex-wrap items-center gap-2">
          <input type="file" accept=".json" ref={fileInput} onChange={importJSON} className="hidden"/>
          <button onClick={()=>fileInput.current.click()} className="flex items-center gap-2 px-3 py-2 rounded-lg border border-[var(--border)] text-sm hover:border-[var(--muted)]"><IUp className="w-4 h-4"/>Importar JSON</button>
          <button onClick={exportCSV} className="flex items-center gap-2 px-3 py-2 rounded-lg border border-[var(--border)] text-sm hover:border-[var(--muted)]"><IDown className="w-4 h-4"/>CSV</button>
          <button onClick={exportJSON} className="flex items-center gap-2 px-3 py-2 rounded-lg border border-[var(--border)] text-sm hover:border-[var(--muted)]"><IDown className="w-4 h-4"/>JSON</button>
          <button onClick={()=>{setEditing(null);setShowForm(true);}} className="flex items-center gap-2 px-4 py-2 rounded-lg font-medium" style={{background:"var(--gold)",color:"#181405"}}><IPlus className="w-4 h-4"/>Agregar ítem</button>
        </div>
      </header>

      {importError && (
        <div className="flex items-center justify-between gap-3 mb-4 px-4 py-2 rounded-lg border" style={{borderColor:"var(--red)", background:"var(--red)11", color:"var(--red)"}}>
          <span className="text-sm">{importError}</span>
          <button onClick={()=>setImportError("")} className="shrink-0"><IX className="w-4 h-4"/></button>
        </div>
      )}

      <div className="flex gap-1 p-1 rounded-lg bg-[var(--surface2)] w-fit mb-4">
        {[["todos","Todo"],["venta","Para vender"],["coleccion","Colección personal"]].map(([v,label])=>(
          <button key={v} onClick={()=>setVista(v)} className="px-3 py-1.5 rounded-md text-sm font-medium" style={vista===v?{background:"var(--gold)",color:"#181405"}:{color:"var(--muted)"}}>{label}</button>
        ))}
      </div>

      <section className="grid grid-cols-2 lg:grid-cols-5 gap-4 mb-6">
        <KPI label="Inversión total" value={fmt(stats.inversion)} icon={<ICoin/>} tone="violet" sub="Capital invertido"/>
        <KPI label="Ingresos proyectados" value={fmt(stats.ingresosVenta)} icon={<IBox/>} tone="gold" sub={`Valor de mercado ref.: ${fmt(stats.valorMercado)}`}/>
        <KPI label={stats.ganancia>=0?"Ganancia proyectada":"Pérdida proyectada"} value={fmt(stats.ganancia)} icon={stats.ganancia>=0?<ITrendUp/>:<ITrendDown/>} tone={stats.ganancia>=0?"green":"red"} sub={`${stats.pct>=0?"+":""}${stats.pct.toFixed(1)}% vs. inversión (tu precio)`}/>
        <KPI label={stats.gananciaMercado>=0?"Ganancia según mercado":"Pérdida según mercado"} value={fmt(stats.gananciaMercado)} icon={stats.gananciaMercado>=0?<ITrendUp/>:<ITrendDown/>} tone={stats.gananciaMercado>=0?"green":"red"} sub={`${stats.pctMercado>=0?"+":""}${stats.pctMercado.toFixed(1)}% si vendieras a precio de mercado`}/>
        <KPI label="Ítems en stock" value={stats.stock} icon={<ILayers/>} tone="violet" sub={`${items.length} productos distintos`}/>
      </section>

      <section className="flex flex-col md:flex-row gap-3 mb-4">
        <div className="relative flex-1">
          <ISearch className="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-[var(--muted)]"/>
          <input value={query} onChange={e=>setQuery(e.target.value)} placeholder="Buscar por nombre o notas..." className="w-full rounded-lg pl-9 pr-3 py-2"/>
        </div>
        <select value={filtroJuego} onChange={e=>setFiltroJuego(e.target.value)} className="rounded-lg px-3 py-2">
          <option>Todos</option>
          {JUEGOS.map(j=><option key={j}>{j}</option>)}
        </select>
        <select value={orden} onChange={e=>setOrden(e.target.value)} className="rounded-lg px-3 py-2">
          <option value="recientes">Más recientes</option>
          <option value="ganancia">Mayor ganancia (tu precio)</option>
          <option value="gananciaMercado">Mayor ganancia (mercado)</option>
          <option value="valor">Mayor valor de mercado</option>
        </select>
      </section>

      <section className="bg-[var(--surface)] border border-[var(--border)] rounded-xl overflow-x-auto">
        <table className="w-full text-sm min-w-[1020px]">
          <thead>
            <tr className="text-left text-[var(--muted)] border-b border-[var(--border)]">
              <th className="p-3 font-medium w-14"></th>
              <th className="p-3 font-medium">Producto</th>
              <th className="p-3 font-medium">Juego</th>
              <th className="p-3 font-medium">Condición</th>
              <th className="p-3 font-medium text-right">Cant.</th>
              <th className="p-3 font-medium text-right">P. Compra</th>
              <th className="p-3 font-medium text-right">P. Mercado</th>
              <th className="p-3 font-medium text-right">P. Venta</th>
              <th className="p-3 font-medium text-right">Ganancia/Pérdida</th>
              <th className="p-3 font-medium text-center">Acciones</th>
            </tr>
          </thead>
          <tbody>
            {filtered.length===0 && (
              <tr><td colSpan="10" className="p-8 text-center text-[var(--muted)]">Sin resultados. Agrega un ítem o ajusta los filtros.</td></tr>
            )}
            {filtered.map(it=>{
              const positivo = it.gananciaTotal>=0;
              return (
                <tr key={it.id} className="border-b border-[var(--border)] last:border-0 hover:bg-[var(--surface2)]/60">
                  <td className="p-3">
                    <div className="w-11 h-11 rounded-lg border border-[var(--border)] bg-[var(--surface2)] flex items-center justify-center overflow-hidden">
                      {it.foto ? <img src={it.foto} alt="" className="w-full h-full object-cover"/> : <IImage className="w-4 h-4 text-[var(--muted)]"/>}
                    </div>
                  </td>
                  <td className="p-3">
                    <div className="flex items-center gap-2">
                      <span className="font-medium">{it.nombre}</span>
                      {it.tipo==="Colección personal" && (
                        <span className="text-[10px] uppercase tracking-wide px-1.5 py-0.5 rounded" style={{background:"var(--violet)22", color:"var(--violet)"}}>Colección</span>
                      )}
                    </div>
                    {(it.edicion || it.grading) && (
                      <div className="text-xs text-[var(--muted)]">{[it.edicion,it.grading].filter(Boolean).join(" • ")}</div>
                    )}
                    {(it.escala || it.linea) && (
                      <div className="text-xs text-[var(--muted)]">{[it.linea,it.escala].filter(Boolean).join(" • ")}</div>
                    )}
                    {it.notas && <div className="text-xs text-[var(--muted)] max-w-xs truncate">{it.notas}</div>}
                  </td>
                  <td className="p-3 text-[var(--muted)]">{it.juego}</td>
                  <td className="p-3 text-[var(--muted)]">{it.condicion}</td>
                  <td className="p-3 text-right">{it.cantidad}</td>
                  <td className="p-3 text-right">
                    <div>{fmt(it.pCompraCOP)}</div>
                    {it.monedaCompra==="USD" && (
                      <div className="text-xs text-[var(--muted)]">{fmtUSD(it.pCompra)} × {Number(it.tasaCambio).toLocaleString("es-CO")}</div>
                    )}
                  </td>
                  <td className="p-3 text-right">
                    <div>{fmt(it.pMercado)}</div>
                    {it.gananciaMercadoPct!=null && (
                      <div className="flex items-center justify-end gap-1 text-xs font-medium" style={{color: it.gananciaMercadoPct>=0?"var(--green)":"var(--red)"}} title="Ganancia/pérdida acumulada frente a lo que pagaste">
                        {it.gananciaMercadoPct>=0?<ITrendUp className="w-3 h-3"/>:<ITrendDown className="w-3 h-3"/>}
                        {it.gananciaMercadoPct>=0?"+":""}{it.gananciaMercadoPct.toFixed(1)}% vs. compra
                      </div>
                    )}
                    {it.trendPct!=null && (
                      <div className="text-[10px] text-[var(--muted)]" title="Cambio desde el último registro de precio">{it.trendPct>=0?"+":""}{it.trendPct.toFixed(1)}% reciente</div>
                    )}
                  </td>
                  <td className="p-3 text-right font-medium">{fmt(it.pVenta)}</td>
                  <td className="p-3 text-right">
                    <div className="flex items-center justify-end gap-1 font-medium" style={{color: positivo?"var(--green)":"var(--red)"}}>
                      {positivo?<ITrendUp className="w-3.5 h-3.5"/>:<ITrendDown className="w-3.5 h-3.5"/>}
                      {fmt(it.gananciaTotal)}
                    </div>
                    <div className="text-xs text-[var(--muted)]">{fmt(it.gananciaUnidad)}/u</div>
                  </td>
                  <td className="p-3">
                    <div className="flex items-center justify-center gap-2">
                      <button onClick={()=>setHistoryId(it.id)} title="Historial de precio" className="p-1.5 rounded-md hover:bg-[var(--surface2)] text-[var(--muted)] hover:text-[var(--violet)]"><IHistory className="w-4 h-4"/></button>
                      <button onClick={()=>{setEditing(it);setShowForm(true);}} className="p-1.5 rounded-md hover:bg-[var(--surface2)] text-[var(--muted)] hover:text-[var(--gold)]"><IEdit className="w-4 h-4"/></button>
                      <button onClick={()=>setDeleteId(it.id)} className="p-1.5 rounded-md hover:bg-[var(--surface2)] text-[var(--muted)] hover:text-[var(--red)]"><ITrash className="w-4 h-4"/></button>
                    </div>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </section>

      {showForm && <ProductForm editing={editing} onSave={saveItem} onClose={()=>{setShowForm(false);setEditing(null);}}/>}
      {historyId && items.find(i=>i.id===historyId) && (
        <PriceHistoryModal item={items.find(i=>i.id===historyId)} onClose={()=>setHistoryId(null)} onAdd={addSnapshot}/>
      )}
      {deleteId && (
        <ConfirmDialog
          mensaje="¿Eliminar este ítem del inventario? Esta acción no se puede deshacer."
          onCancel={()=>setDeleteId(null)}
          onConfirm={()=>{removeItem(deleteId); setDeleteId(null);}}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
